name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate EBarCode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.25.0
          pnpm --version

      - name: Restore API
        run: dotnet restore src/Backend/NTK.EBarCode.Api/NTK.EBarCode.Api.csproj --runtime win-x64

      - name: Build API
        run: dotnet build src/Backend/NTK.EBarCode.Api/NTK.EBarCode.Api.csproj --configuration Release --no-restore --nologo

      - name: Install frontend dependencies
        working-directory: src/Frontend/NTK.EBarCode.Client
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: src/Frontend/NTK.EBarCode.Client
        run: pnpm exec ng build --configuration production
